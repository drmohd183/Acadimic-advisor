# Nginx: وكيل عكسي أمام التطبيق على النطاق الفرعي advisor.ptuk.edu.ps
# ضع شهادة الجامعة (أو شهادة Let's Encrypt) في المسارات أدناه.
server {
    listen 80;
    server_name advisor.ptuk.edu.ps;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name advisor.ptuk.edu.ps;

    ssl_certificate     /etc/ssl/ptuk/fullchain.pem;
    ssl_certificate_key /etc/ssl/ptuk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # ملفات الاستيراد CSV قد تصل إلى 5 ميغابايت
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
