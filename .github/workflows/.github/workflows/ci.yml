name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
          POSTGRES_DB: advisor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://advisor:advisor@localhost:5432/advisor_test
      DATABASE_URL: postgres://advisor:advisor@localhost:5432/advisor_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
